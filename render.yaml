services:
  - type: web
    name: cybersec-crm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INVITE_CODE
        value: CYBERSEC-ADMIN-2026
      - key: GEMINI_API_KEY
        sync: false
