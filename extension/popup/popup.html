<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSec Threat Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <svg class="brand-logo-svg" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#fff" stroke-width="3" stroke-linecap="butt"><line x1="23" y1="0" x2="23" y2="19.5"/><polyline points="14,10.2 23,19.2 32,10.2" fill="none"/></g>
          <g stroke="#fff" stroke-width="3" stroke-linecap="butt" transform="rotate(90,23,23)"><line x1="23" y1="0" x2="23" y2="19.5"/><polyline points="14,10.2 23,19.2 32,10.2" fill="none"/></g>
          <g stroke="#fff" stroke-width="3" stroke-linecap="butt" transform="rotate(180,23,23)"><line x1="23" y1="0" x2="23" y2="19.5"/><polyline points="14,10.2 23,19.2 32,10.2" fill="none"/></g>
          <g stroke="#fff" stroke-width="3" stroke-linecap="butt" transform="rotate(270,23,23)"><line x1="23" y1="0" x2="23" y2="19.5"/><polyline points="14,10.2 23,19.2 32,10.2" fill="none"/></g>
        </svg>
        <div>
          <h1 class="brand-title">CyberSec</h1>
          <p class="brand-subtitle">Email Threat Radar</p>
        </div>
      </div>
      <div id="statusPill" class="status-pill status-loading">
        <span class="status-dot"></span>
        <span id="statusText">CONNECTING</span>
      </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalScansCount">-</div>
        <div class="stat-label">Total Ingested</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-danger" id="threatsBlockedCount">-</div>
        <div class="stat-label">Threats Caught</div>
      </div>
    </div>

    <!-- Toggle Settings -->
    <div class="setting-card">
      <div class="setting-info">
        <span class="setting-title">Auto-Scan on Open</span>
        <span class="setting-desc">Inspect incoming emails automatically</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="autoScanToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Last Scan Summary -->
    <div class="recent-card" id="recentScanCard" style="display: none;">
      <div class="recent-header">
        <span class="recent-title">Latest Inspected Email</span>
        <span class="recent-badge" id="recentBadge">SAFE</span>
      </div>
      <div class="recent-subject" id="recentSubject">No scan recorded</div>
      <div class="recent-sender" id="recentSender"></div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-group">
      <button id="openWriterBtn" class="btn btn-primary">
        <span>◆ AI Email Writer Studio</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      </button>
      <button id="openDashboardBtn" class="btn btn-secondary">
        <span>◆ Open CyberSec Dashboard</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </button>
      <button id="checkConnectionBtn" class="btn btn-secondary">
        <span>🔄 Test Radar Health</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="sys-tag">CYBERSEC // ENGINE v1.1.0</span>
      <span class="host-pill">localhost:3000</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
